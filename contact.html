<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Shekar WebDev</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

   <!-- Google tag (gtag.js) -->
   <script async src="https://www.googletagmanager.com/gtag.js?id=G-5TNFWLB3KF"></script>
   <script>
     window.dataLayer = window.dataLayer || [];
     function gtag(){dataLayer.push(arguments);}
     gtag('js', new Date());

     gtag('config', 'G-5TNFWLB3KF');
   </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navigation Bar -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold text-blue-600">Shekar.Builds</a>
            <nav class="space-x-6">
                <a href="index.html" class="text-gray-600 hover:text-blue-600 transition">Home</a>
                <a href="resources.html" class="text-gray-600 hover:text-blue-600 transition">Resources</a>
                <a href="contact.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">Contact Us</a>
            </nav>
        </div>
    </header>

    <!-- Contact Section -->
    <section class="max-w-3xl mx-auto px-4 py-16">
        <div class="text-center mb-12">
            <h1 class="text-3xl md:text-5xl font-extrabold text-gray-900 mb-4">
                Let's Talk About Your Project
            </h1>
            <p class="text-lg text-gray-600">
                Share your requirements below. Whether you need a website built, managed, or promoted, we are here to help.
            </p>
        </div>

        <!-- Contact Form Box -->
        <div class="bg-white p-8 md:p-10 rounded-2xl shadow-sm border border-gray-200">
            <form id="contactForm" class="space-y-6">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Your Name</label>
                    <input type="text" id="name" name="name" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none" placeholder="John Doe">
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Your Email Address</label>
                    <input type="email" id="email" name="email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none" placeholder="john@example.com">
                </div>

                <div>
                    <label for="message" class="block text-sm font-medium text-gray-700 mb-2">Your Short Requirement / Message</label>
                    <textarea id="message" name="message" rows="5" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none" placeholder="Tell us about your business and what you need help with..."></textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-medium py-3 rounded-lg hover:bg-blue-700 transition shadow-md">
                    Send Requirement
                </button>
            </form>
            <div id="formStatus" class="mt-4 text-center text-sm font-medium hidden"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-8 text-center">
        <p class="text-gray-400 text-sm">&copy; 2026 Shekar WebDev. All rights reserved.</p>
    </footer>

    <!-- Form Handler Script -->
    <script>
        const form = document.getElementById('contactForm');
        const statusDiv = document.getElementById('formStatus');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            statusDiv.textContent = "Sending your message...";
            statusDiv.className = "mt-4 text-center text-sm font-medium text-blue-600";
            statusDiv.classList.remove('hidden');

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            };

            try {
                // REPLACE WITH YOUR ACTUAL CLOUDFLARE WORKER URL
                const response = await fetch('https://shekar-contact-worker.shekarweblab.workers.dev/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusDiv.textContent = "Thank you! Your message has been sent successfully.";
                    statusDiv.className = "mt-4 text-center text-sm font-medium text-green-600";
                    form.reset();
                } else {
                    throw new Error(data.error || 'Failed to send message.');
                }
            } catch (error) {
                statusDiv.textContent = "Error sending message. Please try again later.";
                statusDiv.className = "mt-4 text-center text-sm font-medium text-red-600";
            }
        });
    </script>

</body>
</html>
